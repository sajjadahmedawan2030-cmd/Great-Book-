
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Book</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #26334a;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  color: #2864dc;
  font-size: 28px;
  font-weight: bold;
}

.container {
  max-width: 420px;
  margin: 55px auto;
  padding: 30px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 5px 25px #00000012;
}

h2 {
  text-align: center;
  color: #2864dc;
}

input, textarea {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ccd3df;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #2864dc;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.switch {
  text-align: center;
  margin-top: 20px;
}

.switch a {
  color: #2864dc;
  cursor: pointer;
}

#message, #profileMessage {
  text-align: center;
  margin-top: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header>Great Book</header>

<div class="container">

  <!-- LOGIN AND SIGNUP -->
  <div id="authForm">

    <h2 id="heading">Welcome Back!</h2>

    <p style="text-align:center" id="description">
      Login to your Great Book account
    </p>

    <input id="email" type="email"
      placeholder="Email Address" required>

    <input id="password" type="password"
      placeholder="Password (minimum 6 characters)"
      required>

    <button id="submitBtn" type="button">
      Log In
    </button>

    <div class="switch">
      <span id="switchText">
        Don't have an account?
      </span>
      <a id="switchLink">Sign Up</a>
    </div>

  </div>

  <!-- USER PROFILE -->
  <div id="profile" class="hidden">

    <h2>My Profile</h2>

    <p id="userEmail"
      style="text-align:center; overflow-wrap:anywhere;">
    </p>

    <input id="fullName" type="text"
      placeholder="Enter Your Full Name">

    <textarea id="aboutMe"
      placeholder="Tell us about yourself"
      style="height:100px; resize:vertical;">
    </textarea>

    <button id="saveProfileBtn" type="button">
      Save Profile
    </button>

    <p id="profileMessage"></p>

    <button id="logoutBtn" type="button">
      Log Out
    </button>

  </div>

  <p id="message"></p>

</div>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Your existing Supabase details
const SUPABASE_URL =
'https://iwxxvprwcmvjcqfcgwlm.supabase.co';

const SUPABASE_KEY =
'sb_publishable_PFkz8gAIw631SjyQeIrxJA_cn9fAJws';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let isSignup = false;

const email = document.getElementById('email');
const password = document.getElementById('password');
const message = document.getElementById('message');
const authForm = document.getElementById('authForm');
const profile = document.getElementById('profile');

function showMessage(text, color = '#2864dc') {
  message.textContent = text;
  message.style.color = color;
}

function showProfileMessage(text, color = '#2864dc') {
  const result = document.getElementById('profileMessage');
  result.textContent = text;
  result.style.color = color;
}

function showLogin() {
  profile.classList.add('hidden');
  authForm.classList.remove('hidden');

  document.getElementById('fullName').value = '';
  document.getElementById('aboutMe').value = '';

  showProfileMessage('');
}

async function loadProfile(user) {

  showProfileMessage('Loading profile...');

  const { data, error } = await supabase
    .from('profiles')
    .select('full_name, about')
    .eq('id', user.id)
    .maybeSingle();

  if (error) {
    showProfileMessage(
      'Could not load profile: ' + error.message,
      'red'
    );
    return;
  }

  document.getElementById('fullName').value =
    data?.full_name || '';

  document.getElementById('aboutMe').value =
    data?.about || '';

  showProfileMessage('');
}

function showUser(user) {

  authForm.classList.add('hidden');
  profile.classList.remove('hidden');

  document.getElementById('userEmail').textContent =
    'Logged in as: ' + user.email;

  showMessage('');

  loadProfile(user);
}

// SWITCH BETWEEN LOGIN AND SIGNUP

document.getElementById('switchLink')
.addEventListener('click', () => {

  isSignup = !isSignup;

  document.getElementById('heading').textContent =
    isSignup ? 'Create Your Account' : 'Welcome Back!';

  document.getElementById('description').textContent =
    isSignup
      ? 'Join the Great Book community'
      : 'Login to your Great Book account';

  document.getElementById('submitBtn').textContent =
    isSignup ? 'Sign Up' : 'Log In';

  document.getElementById('switchText').textContent =
    isSignup
      ? 'Already have an account?'
      : "Don't have an account?";

  document.getElementById('switchLink').textContent =
    isSignup ? 'Log In' : 'Sign Up';

  showMessage('');
});

// LOGIN AND SIGNUP

document.getElementById('submitBtn')
.addEventListener('click', async () => {

  const e = email.value.trim();
  const p = password.value;

  if (!e || !p) {
    showMessage(
      'Please enter your email and password.',
      'red'
    );
    return;
  }

  if (p.length < 6) {
    showMessage(
      'Password must be at least 6 characters.',
      'red'
    );
    return;
  }

  const btn = document.getElementById('submitBtn');

  btn.disabled = true;
  showMessage('Please wait...');

  try {

    let result;

    if (isSignup) {

      result = await supabase.auth.signUp({
        email: e,
        password: p,
        options: {
          emailRedirectTo:
          'https://sajjadahmedawan2030-cmd.github.io/Great-Book-/'
        }
      });

      if (result.error) {
        showMessage(result.error.message, 'red');
      } else if (result.data.session) {

        showUser(result.data.user);

        showMessage(
          'Account created successfully!',
          'green'
        );

      } else {

        showMessage(
          'Account created! Please check your email to confirm your account.',
          'green'
        );

      }

    } else {

      result = await supabase.auth.signInWithPassword({
        email: e,
        password: p
      });

      if (result.error) {

        showMessage(result.error.message, 'red');

      } else {

        showUser(result.data.user);

        showMessage('Login successful!', 'green');

      }

    }

  } catch (error) {

    showMessage(error.message, 'red');

  } finally {

    btn.disabled = false;

  }

});

// SAVE PROFILE

document.getElementById('saveProfileBtn')
.addEventListener('click', async () => {

  const btn = document.getElementById('saveProfileBtn');

  btn.disabled = true;

  showProfileMessage('Saving profile...');

  try {

    const { data: userData, error: userError } =
      await supabase.auth.getUser();

    if (userError || !userData.user) {
      showProfileMessage(
        'Please log in first.',
        'red'
      );
      return;
    }

    const user = userData.user;

    const fullName =
      document.getElementById('fullName').value.trim();

    const about =
      document.getElementById('aboutMe').value.trim();

    const { error } = await supabase
      .from('profiles')
      .upsert({
        id: user.id,
        full_name: fullName,
        about: about
      }, {
        onConflict: 'id'
      });

    if (error) {

      showProfileMessage(
        'Error: ' + error.message,
        'red'
      );

    } else {

      showProfileMessage(
        'Profile saved successfully!',
        'green'
      );

    }

  } catch (error) {

    showProfileMessage(
      error.message,
      'red'
    );

  } finally {

    btn.disabled = false;

  }

});

// LOGOUT

document.getElementById('logoutBtn')
.addEventListener('click', async () => {

  const btn = document.getElementById('logoutBtn');

  btn.disabled = true;

  const { error } = await supabase.auth.signOut();

  btn.disabled = false;

  if (error) {
    showProfileMessage(
      'Logout error: ' + error.message,
      'red'
    );
    return;
  }

  showLogin();
  showMessage('You have logged out.');

});

// CHECK EXISTING LOGIN SESSION

const { data, error } =
  await supabase.auth.getSession();

if (error) {

  showMessage(
    'Session error: ' + error.message,
    'red'
  );

} else if (data.session) {

  showUser(data.session.user);

}

</script>

</body>
</html>
